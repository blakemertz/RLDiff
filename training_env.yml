name: RLDiff_train
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - scipy=1.17.1
  - pandas=2.3.3
  - biopython=1.88
  - tqdm=4.67.1
  - smina=2020.12.10
  - networkx=3.6.1
  - pip:
      - pyyaml==6.0.3
      # torch build matched to the parent DiffDock-Pocket repo's Phase 2 stack
      # (see PHASE2_MODERNIZATION.md) -- RLDiff loads parent-built checkpoints
      # and imports parent internals directly, so these must move in lockstep.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      # rdkit installed via pip (like the parent repo) rather than conda: the
      # conda-channel rdkit=2026.3.6 requires a much newer libboost than
      # smina's pinned version supports, an unresolvable conda-level conflict.
      - rdkit==2026.3.6
      - torch==2.6.0
      - -f https://data.pyg.org/whl/torch-2.6.0+cu124.html
      - torch-geometric==2.8.0.post1
      - torch-cluster==1.6.3
      - torch-scatter==2.1.2
      - torch-sparse==0.6.18
      - torch-spline-conv==1.2.2
      - e3nn==0.6.0
      - fair-esm==2.0.0
      - spyrmsd==0.9.0
      # imported directly by the parent repo's datasets/process_mols.py
      - scikit-learn==1.9.1
      - wandb==0.21.4
      - posebusters==0.3.1
      - accelerate==0.24.1
      # huggingface_hub pinned to a release contemporaneous with accelerate==0.24.1
      # (0.35.0 postdates it by ~2 years and drops APIs accelerate 0.24.x still uses)
      - huggingface_hub==0.19.4
      - safetensors==0.6.2
